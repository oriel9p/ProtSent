[project]
name = "protsent"
version = "0.1.0"
description = "Protein Sentence Transformers: contrastive fine-tuning for protein language models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
        "accelerate>=1.3.0",
        "bio>=1.8.1",
        "datasets>=4.6.1",
        "einops>=0.8.2",
        "huggingface-hub>=1.5.0",
        "kernels>=0.15.2,<0.16",  # flash-attn kernels need >=0.15.2; below that they fail to load and fall back to sdpa
        "matplotlib>=3.10.0",
        "numpy>=2.4.3",
        "optuna>=4.4.0",
        "pandas>=3.0.1",
        "polars>=1.38.1",
        "pyarrow>=23.0.1",
        "pyhmmer>=0.10.15",
        "requests>=2.32.5",
        "scikit-learn>=1.8.0",
        "scipy>=1.17.1",
        "sentence-transformers>=6.0.0,<6.1",
        "torch>=2.10.0",
        "transformers>=5.3.0",
        "tqdm>=4.67.1",
        "wandb>=0.21.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests requiring GPU and network access (deselect with '-m not slow')",
    "benchmark: dataset builder performance benchmarks (select with '-m benchmark -s')",
]

[tool.ruff]
extend-exclude = ["*.ipynb"]
